server:
  port: 8081

spring:
  profiles:
    active: local

  application:
    name: ai-interviewer
  ai:
    deepseek:
      api-key: ??
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

  datasource:
    url: url
    username: username
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  rabbitmq:
    host: localhost
    port: 5672
    username: username
    password: password

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lingfeng.interviewer.entity
  configuration:
    map-underscore-to-camel-case: true