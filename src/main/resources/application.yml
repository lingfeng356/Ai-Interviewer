server:
  port: 8081

spring:
  profiles:
    active: local

  application:
    name: ai-interviewer

  datasource:
    url: url
    username: username
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  rabbitmq:
    host: localhost
    port: 5672
    username: username
    password: password

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lingfeng.interviewer.entity
  configuration:
    map-underscore-to-camel-case: true


sa-token:
  token-name: satoken
  timeout: 2592000       # 30 天
  is-concurrent: true
  is-log: true

llm:
  default-provider: deepseek        # 默认用哪个模型
  providers:                        # 所有模型都放这里
    deepseek:
      api-key: api-key
      base-url: https://api.deepseek.com
      model: deepseek-chat
    ollama:
      base-url: http://localhost:11434
      model: qwen3:4b